[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snakeml"
version = "0.1.0"
description = "A simple ML library in pure Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.setuptools.packages.find]
where = ["."]

[tool.mypy]
# mypy >= 2.4 cannot target 3.9, so this is the lowest version it accepts.
# The code itself stays 3.9-compatible at runtime: every modern syntax use is
# either behind `from __future__ import annotations` or a sys.version_info
# guard in structs/dtypes.py.
python_version = "3.10"
files = ["structs", "matlib", "debug"]
# These are the checks that matter for the annotations in structs/.
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
